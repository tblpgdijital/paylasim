<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#002b49">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>TUI BLUE Palm Garden - Paylaşım Yönetim Merkezi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7f9;font-family:Arial,sans-serif}
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f7f9;opacity:0;transition:opacity .18s}
#boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;color:#fff;background:radial-gradient(circle at 18% 15%,rgba(0,150,136,.22),transparent 33%),radial-gradient(circle at 84% 82%,rgba(0,116,184,.20),transparent 34%),linear-gradient(145deg,#002b49 0%,#004f78 55%,#00344f 100%);transition:opacity .35s}
.card{width:min(540px,94vw);text-align:center;padding:30px 28px 26px;border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.17);box-shadow:0 30px 70px rgba(0,0,0,.27),inset 0 1px 0 rgba(255,255,255,.10)}
.brand{font-size:11px;font-weight:900;letter-spacing:1px;color:rgba(255,255,255,.82)}
.visual{position:relative;width:150px;height:150px;margin:20px auto 16px}
.ring{position:absolute;border-radius:50%}.r1{inset:0;border:2px solid rgba(255,255,255,.12);border-top:3px solid #4fe3c8;animation:ring 2.2s linear infinite}.r2{inset:18px;border:1px solid rgba(255,255,255,.14);border-left:2px solid #63cbff;animation:ring 3s linear infinite reverse}.r3{inset:36px;border:2px dashed rgba(255,255,255,.48);animation:ring 4.2s linear infinite}
.core{position:absolute;inset:49px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#0faac5,#0074a8 57%,#00517c);box-shadow:0 14px 35px rgba(0,0,0,.28)}
.core span{font-size:28px;animation:pulse 1.5s ease-in-out infinite}
h2{margin:0;font-size:22px}
p{margin:7px auto 0;max-width:430px;color:rgba(255,255,255,.72);font-size:12px;line-height:1.6}
.meta{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:rgba(255,255,255,.82);margin:19px auto 7px;max-width:400px}
.progress{height:7px;max-width:400px;margin:auto;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}.progress span{display:block;height:100%;width:8%;border-radius:99px;background:linear-gradient(90deg,#4fe3c8,#5fc4ff);transition:width .22s}
#errorBox{display:none;margin:18px auto 0;max-width:430px;padding:13px;border:1px solid rgba(255,220,170,.42);background:rgba(89,34,8,.28);border-radius:15px;text-align:left}
#errorBox b{display:block;font-size:12px;color:#ffe7c0;margin-bottom:5px}
#errorText{font-size:11px;line-height:1.55;color:#fff3de;word-break:break-word}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{border:0;border-radius:10px;padding:9px 11px;font-size:10px;font-weight:800;cursor:pointer}
.retry{background:#4fe3c8;color:#06394a}.show{background:#fff;color:#17495f}
@keyframes ring{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
</style>
</head>
<body>

<div id="boot">
 <div class="card">
  <div class="brand">TUI BLUE PALM GARDEN • YÖNETİM MERKEZİ</div>
  <div class="visual">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="core"><span>◆</span></div>
  </div>
  <h2>Yönetim Merkezi verileri yükleniyor…</h2>
  <p>Yetkiniz doğrulanıyor, analiz ve yönetim verileri hazırlanıyor.</p>

  <div class="meta">
    <span id="status">Güvenli yönetim bağlantısı</span>
    <span id="pct">8%</span>
  </div>
  <div class="progress"><span id="bar"></span></div>

  <div id="errorBox">
    <b>Yönetim ekranı hazır sinyali göndermedi.</b>
    <div id="errorText"></div>
    <div class="actions">
      <button class="retry" onclick="location.reload()">Tekrar Dene</button>
      <button class="show" onclick="showRawFrame()">Teknik Ekranı Göster</button>
    </div>
  </div>
 </div>
</div>

<iframe id="appFrame"
        title="TUI BLUE Palm Garden Paylaşım Yönetim Merkezi"
        src="about:blank"
        referrerpolicy="no-referrer"
        loading="eager"></iframe>

<script>
/*
 * ÖNEMLİ:
 * Yeni Apps Script deployment URL oluşturursanız yalnız aşağıdaki PM_EXEC değerini güncelleyin.
 * Mevcut deployment yeni sürüme geçirilirse URL değişmez.
 */
const PM_EXEC='https://script.google.com/macros/s/AKfycbyce71v4QO3dT6w3d0TJTge3AfvBJWrsVKXcK5Gvg6LZ_rvY4kjjezCjrMSXu36PCry/exec';
const SHELL_VERSION='64';
const MGMT_TRANSFER_KEY='pm_management_ticket_transfer';

const ticket=sessionStorage.getItem(MGMT_TRANSFER_KEY)||'';
const appUrl=new URL(PM_EXEC);
appUrl.searchParams.set('embed','1');
appUrl.searchParams.set('portal','yonetim');
appUrl.searchParams.set('v',SHELL_VERSION);

if(/^[a-f0-9]{64}$/i.test(ticket)){
  appUrl.searchParams.set('ticket',ticket);
}

const boot=document.getElementById('boot');
const frame=document.getElementById('appFrame');
const bar=document.getElementById('bar');
const pct=document.getElementById('pct');
const status=document.getElementById('status');
const errorBox=document.getElementById('errorBox');
const errorText=document.getElementById('errorText');

frame.src=appUrl.toString();
sessionStorage.removeItem(MGMT_TRANSFER_KEY);

let v=8;
let ready=false;
let frameLoaded=false;
let lastBootError='';

function draw(){
  if(ready)v=100;
  else v=Math.min(92,v+(v<45?5:v<72?3:1));

  bar.style.width=v+'%';
  pct.textContent=v+'%';

  if(ready)status.textContent='Hazır';
  else if(v<30)status.textContent='Yönetim yetkisi doğrulanıyor';
  else if(v<60)status.textContent='Analiz verileri hazırlanıyor';
  else if(v<88)status.textContent='Yönetim ekranı hazırlanıyor';
  else status.textContent=frameLoaded?'Apps Script yanıtı bekleniyor':'Bağlantı bekleniyor';
}

const timer=setInterval(draw,160);

function finish(){
  if(ready!==true)return;
  clearInterval(timer);
  v=100;
  draw();
  frame.style.opacity='1';
  setTimeout(()=>{
    boot.style.opacity='0';
    setTimeout(()=>boot.style.display='none',350);
  },150);
}

function showDiagnostic(message){
  const msg=String(message||'').trim()||
    'Apps Script sayfası yüklendi ancak APP_READY mesajı alınamadı. En sık nedenler: Apps Script yeni sürümünün mevcut Web App deploymentına uygulanmaması, GitHub PM_EXEC adresi ile deployment URL’sinin farklı olması veya Apps Script açılış hatası.';
  lastBootError=msg;
  errorText.textContent=msg;
  errorBox.style.display='block';
  status.textContent='Kontrol gerekli';
  console.error('[PM Yönetim Açılış]',msg);
}

function showRawFrame(){
  boot.style.display='none';
  frame.style.opacity='1';
}
window.showRawFrame=showRawFrame;

frame.addEventListener('load',()=>{
  frameLoaded=true;
  if(v<75)v=75;
  draw();

  // iframe load oldu ama uygulama hazır mesajı gelmediyse teşhis göster.
  setTimeout(()=>{
    if(!ready){
      showDiagnostic(lastBootError);
    }
  },6000);
});

frame.addEventListener('error',()=>{
  showDiagnostic('Apps Script iframe yüklenemedi. Web App deployment URL’sini kontrol edin.');
});

function validAppsOrigin(origin){
  if(origin==='null')return true;
  if(origin==='https://script.google.com')return true;
  return /^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/i.test(String(origin||''));
}

window.addEventListener('message',e=>{
  const d=e.data||{};
  if(!validAppsOrigin(e.origin))return;

  if(d.source==='PM_APP'&&d.type==='APP_READY'){
    ready=true;
    draw();
    finish();
    return;
  }

  if(d.source==='PM_APP'&&d.type==='APP_BOOT_ERROR'){
    showDiagnostic(d.message||'Apps Script yönetim açılış hatası.');
  }
});

// Eski sürümdeki gibi 15 saniye sonra loaderı zorla kapatıp beyaz ekran göstermiyoruz.
setTimeout(()=>{
  if(!ready){
    showDiagnostic(lastBootError);
  }
},12000);


// PWA installation bridge
let pmDeferredInstallPrompt=null;

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  pmDeferredInstallPrompt=e;
});

function pmStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone===true;
}

async function pmHandleInstallRequest(sourceWindow){
  let status='unavailable';

  if(pmStandalone()){
    status='installed';
  }else if(pmDeferredInstallPrompt){
    try{
      pmDeferredInstallPrompt.prompt();
      const choice=await pmDeferredInstallPrompt.userChoice;
      status=choice&&choice.outcome==='accepted'?'accepted':'dismissed';
      pmDeferredInstallPrompt=null;
    }catch(e){
      status='unavailable';
    }
  }

  try{
    sourceWindow.postMessage({
      source:'PM_SHELL',
      type:'PWA_INSTALL_RESULT',
      status
    },'*');
  }catch(e){}
}

window.addEventListener('appinstalled',()=>{
  pmDeferredInstallPrompt=null;
});

window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.source==='PM_APP'&&d.type==='PWA_INSTALL_REQUEST'){
    pmHandleInstallRequest(e.source);
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
  });
}
</script>
</body>
</html>
