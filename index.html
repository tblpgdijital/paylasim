<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#002b49">
  <title>TUI BLUE Palm Garden Paylaşım Merkezi</title>
  <meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbyce71v4QO3dT6w3d0TJTge3AfvBJWrsVKXcK5Gvg6LZ_rvY4kjjezCjrMSXu36PCry/exec">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#002b49,#005b83);
      font-family:Arial,sans-serif;
      color:#fff;
    }
    .box{
      text-align:center;
      padding:28px;
      max-width:420px;
    }
    .icon{
      width:72px;
      height:72px;
      margin:0 auto 18px;
      border-radius:22px;
      background:rgba(255,255,255,.14);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:34px;
      animation:pulse 1.6s ease-in-out infinite;
    }
    h1{font-size:22px;margin:0 0 8px}
    p{font-size:14px;opacity:.85;margin:0 0 18px}
    a{
      color:#fff;
      font-weight:700;
    }
    @keyframes pulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.08)}
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">↗</div>
    <h1>Paylaşım Merkezi</h1>
    <p>Uygulama açılıyor…</p>
    <a href="https://script.google.com/macros/s/AKfycbyce71v4QO3dT6w3d0TJTge3AfvBJWrsVKXcK5Gvg6LZ_rvY4kjjezCjrMSXu36PCry/exec">Açılmazsa buraya tıklayın</a>
  </div>

  <script>
    const target = 'https://script.google.com/macros/s/AKfycbyce71v4QO3dT6w3d0TJTge3AfvBJWrsVKXcK5Gvg6LZ_rvY4kjjezCjrMSXu36PCry/exec';
    window.location.replace(target);
  </script>
</body>
</html>
