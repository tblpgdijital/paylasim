<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#002b49">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src https://script.google.com https://script.googleusercontent.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>TUI BLUE Palm Garden Paylaşım Merkezi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7f9;font-family:Arial,sans-serif}
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f7f9}
#boot{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#002b49,#005b83);color:#fff;transition:opacity .3s}
.bootbox{text-align:center;padding:24px}.hub{width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:34px;animation:pulse 1.5s infinite}
h1{font-size:21px;margin:0 0 7px}p{font-size:13px;opacity:.82;margin:0}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
</style>
</head>
<body>
<div id="boot"><div class="bootbox"><div class="hub">◆</div><h1>Paylaşım Merkezi</h1><p>Güvenli uygulama yükleniyor…</p></div></div>
<iframe id="appFrame" title="TUI BLUE Palm Garden Paylaşım Merkezi" src="https://script.google.com/macros/s/AKfycbyce71v4QO3dT6w3d0TJTge3AfvBJWrsVKXcK5Gvg6LZ_rvY4kjjezCjrMSXu36PCry/exec?embed=1&v=15" referrerpolicy="no-referrer" loading="eager"></iframe>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs)await r.unregister();
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
})();

const boot=document.getElementById('boot');
const frame=document.getElementById('appFrame');
let hidden=false;
function hideBoot(){
  if(hidden)return;
  hidden=true;
  boot.style.opacity='0';
  setTimeout(()=>boot.style.display='none',320);
}
frame.addEventListener('load',()=>setTimeout(hideBoot,250));
setTimeout(hideBoot,8000);
</script>
</body>
</html>
