<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#002b49">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:,">
<title>TUI BLUE Palm Garden Paylaşım Merkezi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7f9;font-family:Arial,sans-serif}
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f7f9;opacity:0;transition:opacity .18s}
#boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;background:radial-gradient(circle at 18% 15%,rgba(0,150,136,.22),transparent 33%),radial-gradient(circle at 84% 82%,rgba(0,116,184,.20),transparent 34%),linear-gradient(145deg,#002b49,#004f78 55%,#00344f);transition:opacity .3s}
.card{width:min(500px,92vw);text-align:center;padding:28px 24px 24px;border-radius:25px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.17);box-shadow:0 28px 65px rgba(0,0,0,.27)}
.brand{font-size:11px;font-weight:900;letter-spacing:1px;color:rgba(255,255,255,.84)}
.visual{position:relative;width:145px;height:145px;margin:19px auto 15px}.ring{position:absolute;border-radius:50%}.r1{inset:0;border:2px solid rgba(255,255,255,.12);border-top:3px solid #4fe3c8;animation:ring 2.1s linear infinite}.r2{inset:17px;border:1px solid rgba(255,255,255,.15);border-left:2px solid #63cbff;animation:ring 2.8s linear infinite reverse}.core{position:absolute;inset:43px;border-radius:23px;display:grid;place-items:center;background:linear-gradient(145deg,#0faac5,#0074a8 57%,#00517c);box-shadow:0 14px 35px rgba(0,0,0,.28)}.core span{font-size:31px;animation:pulse 1.5s ease-in-out infinite}
h2{margin:0;font-size:21px}p{margin:7px auto 0;color:rgba(255,255,255,.72);font-size:12px;line-height:1.55}
.meta{display:flex;justify-content:space-between;margin:18px auto 7px;max-width:390px;font-size:10px;font-weight:800;color:rgba(255,255,255,.82)}.progress{height:7px;max-width:390px;margin:auto;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}.progress span{display:block;height:100%;width:10%;border-radius:99px;background:linear-gradient(90deg,#4fe3c8,#5fc4ff);transition:width .2s}
@keyframes ring{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.1)}}
</style>
</head>
<body>
<div id="boot"><div class="card">
 <div class="brand">TUI BLUE PALM GARDEN • PAYLAŞIM MERKEZİ</div>
 <div class="visual"><div class="ring r1"></div><div class="ring r2"></div><div class="core"><span>↻</span></div></div>
 <h2>Paylaşım Merkezi açılıyor</h2>
 <p>Önbelleğe alınmış portal kabuğu hazırlanıyor. Personel verileriniz uygunsa anında gösterilecek.</p>
 <div class="meta"><span id="status">Güvenli bağlantı</span><span id="pct">10%</span></div>
 <div class="progress"><span id="bar"></span></div>
</div></div>
<iframe id="appFrame" title="TUI BLUE Palm Garden Paylaşım Merkezi" src="about:blank" referrerpolicy="no-referrer" loading="eager"></iframe>
<script>
const PM_EXEC='https://script.google.com/macros/s/AKfycbyce71v4QO3dT6w3d0TJTge3AfvBJWrsVKXcK5Gvg6LZ_rvY4kjjezCjrMSXu36PCry/exec';
const SHELL_VERSION='80';
const MGMT_TRANSFER_KEY='pm_management_ticket_transfer';

const legacyQs=new URLSearchParams(location.search);
if((legacyQs.get('portal')||'').toLowerCase()==='yonetim'){
  const ticket=legacyQs.get('ticket')||'';
  if(/^[a-f0-9]{64}$/i.test(ticket))sessionStorage.setItem(MGMT_TRANSFER_KEY,ticket);
  location.replace('./yonetimindex.html');
}

const appUrl=new URL(PM_EXEC);
appUrl.searchParams.set('embed','1');
appUrl.searchParams.set('v',SHELL_VERSION);

const frame=document.getElementById('appFrame');
const boot=document.getElementById('boot');
const bar=document.getElementById('bar');
const pct=document.getElementById('pct');
const status=document.getElementById('status');
frame.src=appUrl.toString();

let value=10,ready=false,loaded=false;
const timer=setInterval(()=>{
  value=Math.min(ready?100:loaded?92:78,value+(value<45?6:value<75?3:1));
  bar.style.width=value+'%';pct.textContent=value+'%';
  status.textContent=value<35?'Güvenli bağlantı':value<70?'Portal hazırlanıyor':value<95?'Personel önbelleği kontrol ediliyor':'Hazır';
  if(ready&&value>=100)finish();
},120);

function finish(){
  if(boot.style.display==='none')return;
  clearInterval(timer);frame.style.opacity='1';
  boot.style.opacity='0';
  setTimeout(()=>boot.style.display='none',300);
}

frame.addEventListener('load',()=>{loaded=true;if(value<75)value=75});
setTimeout(()=>{if(!ready){frame.style.opacity='1';finish()}},9000);

function validAppsOrigin(origin){
  if(origin==='null'||origin==='https://script.google.com')return true;
  return /^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/i.test(String(origin||''));
}

window.addEventListener('message',e=>{
  if(!validAppsOrigin(e.origin))return;
  const d=e.data||{};

  if(d.source==='PM_APP'&&d.type==='APP_READY'){
    ready=true;value=100;bar.style.width='100%';pct.textContent='100%';status.textContent='Hazır';finish();return;
  }

  if(d.source==='PM_APP'&&d.type==='OPEN_MANAGEMENT'){
    const ticket=String(d.ticket||'');
    if(!/^[a-f0-9]{64}$/i.test(ticket))return;
    sessionStorage.setItem(MGMT_TRANSFER_KEY,ticket);
    location.assign('./yonetimindex.html');
    return;
  }

  if(d.source==='PM_APP'&&d.type==='PWA_INSTALL_REQUEST')pmHandleInstallRequest(e.source);
});

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
window.addEventListener('appinstalled',()=>deferredInstall=null);
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
async function pmHandleInstallRequest(source){
  let status='unavailable';
  if(standalone())status='installed';
  else if(deferredInstall){
    try{deferredInstall.prompt();const c=await deferredInstall.userChoice;status=c?.outcome==='accepted'?'accepted':'dismissed';deferredInstall=null}catch(_){}
  }
  try{source.postMessage({source:'PM_SHELL',type:'PWA_INSTALL_RESULT',status},'*')}catch(_){}
}

if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
}
</script>
</body>
</html>
